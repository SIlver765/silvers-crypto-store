version: "3.7"

services:
  web:
    image: ghcr.io/silver765/silvers-hw-monitor:1.4.0
    restart: on-failure
    # 5tratumOS runs no app_proxy - the container must publish the manifest's
    # `port:` (3300) directly on the host.
    ports:
      - "3300:3300"
    # Reading temps only needs /sys mounted (Docker already exposes host sysfs read-only
    # by default). Writing fan speed needs read-write access to the hwmon PWM files, and
    # (on hardware without hwmon fan control, e.g. many HP laptops) to the ACPI cooling
    # device cur_state files under /sys/class/thermal.
    volumes:
      - /sys/class/hwmon:/sys/class/hwmon:rw
      - /sys/class/thermal:/sys/class/thermal:rw
    cap_add:
      - SYS_RAWIO
    environment:
      PORT: "3300"
