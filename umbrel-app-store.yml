# Umbrel (and 5tratumOS, which runs the same app framework) community app
# store manifest. `id` prefixes every app folder in this repo; `name` is
# what shows up in the App Stores UI once someone adds this repo's URL.
#
# Add this store on umbrelOS/5tratumOS via:
#   Settings -> App Store -> Community App Stores -> Add store
#   https://github.com/Silver765/Silvers-crypto-store
id: silvers-crypto-store
# No apostrophe here - 5tratumOS slugifies this into an update "channel" id
# (e.g. "custom-<slug>"), and "Silver's" turns the apostrophe into its own
# hyphen ("silver-s-..."), which 5tratumOS's updater then rejects as an
# invalid channel. Keep this apostrophe-free.
name: Silvers Crypto Store
