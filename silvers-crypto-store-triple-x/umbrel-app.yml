  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: SIlver765
submission: https://github.com/SIlver765/silvers-crypto-store
releaseNotes: >-
  v1.0-Alpha13: rebuilds the XTM Blocks Found detector (lib/tariBlocks.js)
  on confirmed real log wording instead of guessed regexes - two prior
  attempts each produced real false positives from actual node logs (one
  matching "deterMINED" with no word boundary, the other matching an
  unrelated "Header not found for block height N" checkpoint warning).
  Checked tari-project/tari's own source: p2pool's merge-mining SubmitBlock
  gRPC call routes through the exact same handler every P2P-received block
  goes through, which logs "Block #{height} ({hash}) received from
  {source}" - {source} is "remote peer: <id>" for every block synced from
  the network (not a find) or the literal "local services" only when it
  came from this node's own submission. The detector now matches
  specifically on "received from local services", eliminating this whole
  class of false positive at the root rather than patching around new
  patterns as they're found. IMPORTANT: this doesn't retroactively fix a
  state file that already has false entries from an earlier version - see
  README for the tari-blocks-state.json cleanup step.
  v1.0-Alpha12: Overview tab's two blockchain cards (Monero and Minotari,
  still shown side by side) redesigned with more at-a-glance detail - an
  IBD tag while syncing, a Pruned tag for Monero (this stack always runs
  monerod with --prune-blockchain), a Sync ETA estimated from recent
  block-height speed, a "Last block X ago" line for Monero, a new Disk
  tile (blockchain size on disk), and a Peers tile for Minotari. The sync
  progress ring on both cards is also noticeably bigger. Also removes the
  Import Blockchain "Browse..." button entirely - it depended on the
  ssh2 npm package, which turned out to not even be declared as a
  dependency, so it likely errored rather than working; Remote Path is
  now a plain text field, same as Host/Port/Username already were. Also
  fixes a miss from Alpha11: the version badge's APP_VERSION constant had
  been left at "v1.0-Alpha10" in the code that actually shipped as
  Alpha11.
  v1.0-Alpha11: fixes three bugs found right after Alpha10 shipped. The
  Miner Configuration LAN Pool URL was reading the app container's own
  network interfaces, which on 5tratumOS's bridge networking returns
  Docker's internal bridge IP (e.g. 172.18.0.5) instead of the box's real
  LAN address - now uses the incoming request's own Host header instead,
  since the browser loading the page is necessarily already on the LAN.
  The on-screen version badge was a hardcoded string in index.html that
  nothing pointed back at as a step to update, so it silently stayed on
  "Alpha-9" through all of Alpha10 - now driven from one server-side
  constant. XTM Blocks Found could show fabricated blocks on installs
  where minotari-node is merely running, even with Tari merge-mining not
  configured - the log-line detector's substring check for "mined" had no
  word boundary, so it also matched unrelated log lines containing words
  like "deterMINED" or "exaMINED", and recorded a "block found" even when
  the actual height-matching pattern failed to match anything. Now only
  records a block when the specific mined/found/submitted + block + height
  pattern actually matches. IMPORTANT: this only stops new false
  positives - an install already showing an inflated XTM Blocks Found count
  needs its tari-blocks-state.json deleted from the state volume once after
  updating.
  v1.0-Alpha10: real-time worker detection now reads P2Pool's own local
  stratum API instead of parsing logs, so the Pool/Blocks tabs' Miners and
  Blocks Found stats reflect this node's own miners and only blocks this
  node's configured address actually found (verified against the real
  wallet-address match P2Pool's own source performs), not sidechain-wide
  totals from every miner on the pool. The Pool tab's ETA to Find P2Pool
  Share and ETA to Find Block are now combined into one box (using your own
  hashrate for the share ETA, not the pool's, matching p2pool.observer's own
  calculator), and the Hash Rate History / Network Difficulty History
  graphs are redesigned with real 24h server-persisted history, gridlines,
  axis labels, and a legend instead of a 10-minute client-only buffer that
  reset on every reload (also fixes Network Difficulty History actually
  showing Monero mainchain difficulty instead of the sidechain difficulty
  its label claimed). Adds a Miner Configuration LAN/WAN pool URL split, a
  "Send status command" button on the Logs tab (P2Pool's stdin console over
  a named pipe), Discord notifications for workers connecting/disconnecting,
  a clipboard-copy fallback for plain-HTTP/LAN access where the browser
  disables the Clipboard API, and a new opt-in "Automatically stop Minotari
  (XTM) when unused" Settings toggle that stops the Tari node/wallet
  entirely when no Tari address is configured, since Minotari has no
  pruning option upstream and otherwise runs a full always-growing chain
  for a feature many installs never use. Also fixes the Mining Status
  bubble never turning green (stale CSS selector) and Miner Configuration's
  input fields rendering blank (text was being set as textContent instead
  of an input's value).
  v1.0-Alpha9: 5tratumOS runs no app_proxy container, so the dashboard's
  port (3000) is now published directly by the web service instead of
  relying on one to route to it - compose-only fix, no image rebuild
  needed.
  v1.0-Alpha8: efficiency pass - the settings/wallet-state files were being
  re-read and re-parsed from disk several times per poll tick, the Tari
  blocks table was fetched as an extra sequential round-trip instead of in
  parallel with everything else, the Startup Checklist/Network Ports cards
  were torn down and rebuilt every 10s tick even when unchanged, and the
  blocks/workers state file was rewritten to disk on nearly every poll
  during active mining instead of being batched. Also prunes workers not
  seen in 90+ days so that file doesn't grow unbounded on a long-running
  install.
  v1.0-Alpha7: fixes Tari merge-mining's minotari-node container failing to
  stay running two different ways - a comma-parsing bug in its gRPC
  allow-methods list caused an instant crash loop, and (once that was fixed)
  the --init flag turned out to be a one-shot "write default config and
  exit" action rather than "bootstrap then keep running," causing it to exit
  clean and restart forever. Either bug alone could leave the node stuck
  restarting indefinitely, which also blocked the platform's own Stop button
  from working. Also adds "by Silver" to the app name.
  v1.0-Alpha6: fixes Import Blockchain failing (rsync exit 12/23) when the
  remote path is a Windows drive letter (e.g. F:\folder\subfolder) - it's
  now auto-converted to the Cygwin form a Windows rsync install actually
  understands. The Import Blockchain progress bar also now shows the
  transfer percentage as text underneath it.
  v1.0-Alpha5: the Pool tab's Worker Details cards now show each online
  worker's current mining difficulty - the difficulty their most recent
  share was submitted at, which reflects P2Pool's vardiff auto-adjustment
  in real time, unlike the existing best-share stat (their all-time
  record, which only trends upward).
  v1.0-Alpha4: adds an app icon (combining Monero's ghost symbol with
  Tari's logo as a merge-mining badge) - both the web dashboard's
  browser-tab favicon and the App Store listing icon were missing one
  until now.
  v1.0-Alpha3: the Wallet tab now recognizes an externally-managed wallet
  address. If a payout/merge-mining address is saved in Settings without
  ever clicking Create Wallet here, that address belongs to a wallet this
  dashboard has no keys for (a hardware wallet, mobile wallet, exchange,
  another Tari client, etc.) - the Wallet tab now shows a dedicated card
  for it (address only) instead of offering to create an unrelated
  wallet with no connection to the address actually receiving payouts.
  v1.0-Alpha2: fixes Import Blockchain failing with password
  authentication ("rsync exited with code 255 - Connection reset by
  <host> port 22" right after host-key verification). BatchMode=yes was
  disabling ssh's password prompt entirely, so the password auth path
  never actually got a chance to send the password. Only applied on the
  key-based auth path now.
  v1.0-Alpha1: entering Alpha - the Dev1-Dev11 numbered builds are done,
  versioning moves to v1.0-AlphaN going forward. No functional changes
  from Dev11; this is a naming/versioning milestone marking the app as
  feature-complete enough for wider testing.
  v0.0.1-Dev11: no functional changes - rebuilt from the same source as
  Dev10 to test whether 5tratumOS's app-store update detection was stuck
  comparing version strings incorrectly (e.g. treating "Dev10" as older
  than "Dev9" in a plain lexicographic comparison, since "1" < "9").
  v0.0.1-Dev10: fixes the Import Blockchain feature's rsync transfer
  failing against Windows' bundled OpenSSH Server ("rsync exited with code
  255" / "Connection reset by <host> port 22"). This container's ssh
  client tries a post-quantum hybrid key exchange first; Windows' older
  bundled OpenSSH Server doesn't support it and resets the connection
  instead of falling back cleanly. Now forces classical-only key exchange
  for this transfer, which every OpenSSH version in practical use
  supports.
  v0.0.1-Dev9: Discord webhook notifications (Settings tab) - get pinged
  when a Monero block, a Tari block, or (off by default) a P2Pool share is
  found, with a "Send Test Notification" button to confirm it's wired up.
  The Overview readiness checklist's Blockchain Sync check now shows three
  states instead of two - red "Not Running" when the node isn't reachable,
  orange "Syncing" while it's catching up, green "Synced" once caught up -
  instead of treating "offline" and "still syncing" as the same red state.
  The Miner Configuration panel now notes that P2Pool's stratum server
  never actually checks the password field (confirmed from P2Pool's own
  source), and Settings gained a "Which Pool Type Should I Use?" advisor
  panel. Settings is also reorganized: Discord Notifications, the pool-type
  advisor, and the P2Pool memory-usage flags collapse by default so the tab
  takes up less screen space, with Save Settings moved to its own
  always-visible row so it's never hidden. Also fixes the on-screen version
  badge, which had been stuck reading "Dev1" since that build regardless of
  which Dev version was actually running.
  v0.0.1-Dev8: new hidden, opt-in "Import Blockchain" feature in Settings -
  pulls a pre-synced monerod data directory from another machine over
  SSH/rsync, so a new install doesn't have to sync from the network from
  scratch. Off by default (toggle in Settings) since it requires mounting
  the Docker socket into the app container to safely stop/start monerod
  around the copy - full instructions are shown in the app, including how
  to enable an SSH server on the source machine (Windows/Linux/macOS). Adds
  a "Browse..." button next to the Remote Path field that pops up a real
  folder browser (via SFTP) for the other machine, instead of typing a
  path blind. Also fixes the password/textarea fields in Settings
  rendering with a pure-white background instead of matching the app's
  theme.
  v0.0.1-Dev7: per-flag P2Pool memory-usage toggles in Settings
  (--light-mode, --no-randomx, --no-cache, each independently switchable
  with an explanation). Wallet tab now shows real balances and can send
  XMR and XTM (reversing the prior read-only design), with both wallets
  redesigned as real card-shaped widgets (official Monero GUI art / your
  own Tari brand art) with a masked address and a show/hide toggle. The
  Startup Checklist's P2P port check is now three separate checks -
  Monero, P2Pool, and Tari - instead of just Monero, each turning green
  once that service is actually receiving inbound connections.
  v0.0.1-Dev5: fixes the Minotari (Tari base node) container crash-looping
  instantly on every start with "the argument '--base-path <BASE_PATH>'
  cannot be used multiple times". The official image's own startup wrapper
  already hardcodes --base-path /var/tari/node before our own arguments are
  appended, so our extra --base-path=/tari-data was rejected outright. Now
  we don't pass --base-path at all, and our volumes target /var/tari/node
  instead (compose-only fix, no image rebuild needed).
  v0.0.1-Dev4: fixes the Minotari (Tari base node) container never writing
  base_node.log ("Log file not created yet" forever on the Logs tab). The
  official minotari_node image defaults to a non-root "tari" user, but a
  freshly created ${APP_DATA_DIR}/minotari-node volume is owned by root, so
  it couldn't write to its own data/log directories. Now runs as root
  (compose-only fix, no image rebuild needed).
  v0.0.1-Dev3: fixes monerod crashing with "Permission denied:
  /root/.bitmonero" (and the resulting P2Pool crash-loop) - Dev1/Dev2's
  images were published before a HOME/setpriv fix landed on this branch;
  Dev3 rebuilds all 5 images from the fixed source. No functional changes
  from Dev1 otherwise: brand-new "Command Center" dashboard UI - tabs for
  Overview, Pool, Blocks, Wallet, Logs, and Settings, replacing the previous
  single-page layout. Adds a Wallet tab with one-time "generate, show once"
  seed-phrase backup for both the Monero and Tari wallets, an optional
  P2Pool Observer integration for network-wide stats, a live-updating
  mining animation, and real per-worker share/difficulty tracking. Backend
  additions: a new monero-wallet-rpc container (bundled Monero wallet, only
  ever queried for address/seed, never balance or transfers) and real gRPC
  sync-progress reporting for the Minotari node and wallet. Everything
  Tari-related remains experimental/optional - the app works exactly as
  before if you never set a Tari address. Builds on the earlier Dev1-Dev7
  fixes (see git history): monerod's SIGILL crash fix, P2Pool's
  shared-library fix, live sidebar sync status, and the live-tail Logs tab.
