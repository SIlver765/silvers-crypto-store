version: "3.7"

services:
  server:
    image: ghcr.io/silver765/hive-os-pxe@sha256:7fd2698b2492c2e27a1f900358a0c77f3741539435b1b924d90ffd8daa7d5064
    restart: on-failure
    network_mode: host                 # PXE needs L2 broadcast: UDP 67 (proxyDHCP), 69 (TFTP), 4011 (PXE)
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    environment:
      ADMIN_PORT: "8380"               # admin UI, opened directly on this port (host networking)
      PUBLIC_PORT: "8382"              # rig-facing: iPXE script, netboot files, image
      INITIAL_PASSWORD: ${APP_PASSWORD}   # shown next to the app; must be changed at first login
      # SERVER_IP: 192.168.1.50          # uncomment to override auto-detection
    volumes:
      - ${APP_DATA_DIR}/data:/data
